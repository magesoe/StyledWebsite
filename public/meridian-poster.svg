    <path d="M-118-250h236l88 92v316l-88 92h-236l-88-92v-316z" fill="url(#steel)"/>
    <circle r="286" fill="#171a1f" stroke="#050608" stroke-width="25"/>
    <circle r="260" fill="none" stroke="url(#steel)" stroke-width="25"/>
    <circle r="224" fill="url(#dial)" stroke="#3d444c" stroke-width="5"/>
    <g fill="#c6ff4a" filter="url(#glow)">
