<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Meridian M-01 dive watch</title>
  <desc id="desc">A graphite mechanical dive watch lit by narrow studio lights.</desc>
  <defs>
    <radialGradient id="bg" cx="52%" cy="44%" r="65%"><stop offset="0" stop-color="#333a44"/><stop offset=".42" stop-color="#171b21"/><stop offset="1" stop-color="#080a0d"/></radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15181d"/><stop offset=".27" stop-color="#c3cbd1"/><stop offset=".36" stop-color="#3a4048"/><stop offset=".7" stop-color="#101318"/><stop offset=".88" stop-color="#7f8991"/><stop offset="1" stop-color="#252a31"/></linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#090b0e"/><stop offset=".45" stop-color="#343940"/><stop offset=".55" stop-color="#171a1f"/><stop offset="1" stop-color="#080a0c"/></linearGradient>
    <radialGradient id="dial"><stop stop-color="#171d23"/><stop offset=".75" stop-color="#090c10"/><stop offset="1" stop-color="#030405"/></radialGradient>
    <filter id="shadow"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
